---
name: Super linter

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    uses: validatedpatterns/github-actions-library/.github/workflows/superlinter.yml@v1 # zizmor: ignore[unpinned-uses]
    with:
      sl_env: |
        VALIDATE_BIOME_FORMAT=false
        # Exclude Helm templates / chart package content from YAML/kube/checkov-style scans
        FILTER_REGEX_EXCLUDE=.*/(templates|charts)/.*
        VALIDATE_MARKDOWN_PRETTIER=false
        VALIDATE_TRIVY=false
        VALIDATE_MARKDOWN=false
