# This invokes the workflow named 'publish-charts' in the umbrella repo
# It expects to have a secret called CHARTS_REPOS_TOKEN which contains
# the GitHub token that has permissions to invoke workflows and commit code
# inside the umbrella-repo.
# The following fine-grained permissions were used in testing and were limited
# to the umbrella repo only:
# - Actions: r/w
# - Commit statuses: r/w
# - Contents: r/w
# - Deployments: r/w
# - Pages: r/w
#

name: vp-patterns/update-helm-repo

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  # Inlined from validatedpatterns/helm-charts helmlint.yml so we can register
  # the Stakater repo before ct lint (reusable workflows cannot gain extra steps).
  helmlint:
    name: Lint Charts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v4 # zizmor: ignore[unpinned-uses]
        with:
          version: v3.12.2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.7.0 # zizmor: ignore[unpinned-uses]

      - name: Register Helm repo for Chart.yaml dependency (@stakater)
        run: |
          set -euo pipefail
          helm repo add stakater https://stakater.github.io/stakater-charts --force-update

      - name: Run chart-testing (lint)
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct lint --target-branch "${TARGET_BRANCH}"

      - name: Run helm lint
        run: helm lint .

  update-helm-repo:
    needs: [helmlint]
    uses: validatedpatterns/helm-charts/.github/workflows/update-helm-repo.yml@workflow-stable # zizmor: ignore[unpinned-uses]
    permissions: read-all # zizmor: ignore[excessive-permissions]
    secrets: inherit # zizmor: ignore[secrets-inherit]
